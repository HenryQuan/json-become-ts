syntax = "proto3";

package generated;

message Modules {
  string status = 1;
  Meta meta = 2;
  Data data = 3;
}

message Meta {
  int64 count = 1;
  int64 page_total = 2;
  int64 total = 3;
  int64 limit = 4;
  int64 page = 5;
}

message Data {
  Profile profile = 1;
  string name = 2;
  string image = 3;
  string tag = 4;
  string module_id_str = 5;
  int64 module_id = 6;
  string type = 7;
  int64 price_credit = 8;
}

message Profile {
  Torpedoes torpedoes = 1;
}

message Torpedoes {
  int64 torpedo_speed = 1;
  double shot_speed = 2;
  int64 max_damage = 3;
  double distance = 4;
}
